[package]
name = "nbd-server"
version = "0.0.1"
edition = "2024"
rust-version = "1.85"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1.0"
bitflags = "2"
tokio = { version = "1.29", features = ["macros", "rt-multi-thread", "io-util", "net", "sync"] }
io = { git = "https://github.com/nbdd0121/r2vm.git", default-features = false, features = ["block-file"] }
rocksdb = { version = "0.23", default-features = false, optional = true }
rand = { version = "0.9", optional = true }

# Traicng
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
tracing-tree = "0.4.0"

[profile.release]
debug = true

[features]
default = []
rocksdb = ["dep:rocksdb", "dep:rand"]
